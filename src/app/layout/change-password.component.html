<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Cambiar Contraseña</h2>
      <button class="close-btn" (click)="onClose()"><i class="fa fa-times"></i></button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="modal-body">
      <div *ngIf="message" [class.alert-success]="messageType === 'success'" class="alert" [class.alert-error]="messageType === 'error'">
        {{ message }}
      </div>

      <div class="form-group">
        <label for="currentPassword">Contraseña Actual</label>
        <input 
          id="currentPassword"
          type="password" 
          formControlName="currentPassword"
          class="form-control"
          placeholder="Ingresa tu contraseña actual"
        >
      </div>

      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <input 
          id="newPassword"
          type="password" 
          formControlName="newPassword"
          class="form-control"
          placeholder="Ingresa tu nueva contraseña"
        >
        <small>Mínimo 6 caracteres</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          id="confirmPassword"
          type="password" 
          formControlName="confirmPassword"
          class="form-control"
          placeholder="Confirma tu nueva contraseña"
        >
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="onClose()">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="loading">
          {{ loading ? 'Actualizando...' : 'Actualizar Contraseña' }}
        </button>
      </div>
    </form>
  </div>
</div>
